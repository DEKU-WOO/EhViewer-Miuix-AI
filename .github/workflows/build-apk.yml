name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          mkdir -p app/keystore
          keytool -genkey -v -keystore app/keystore/androidkey.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass 000000 -keypass 000000 -dname "CN=Android, OU=AI, O=EhViewer, L=Unknown, ST=Unknown, C=US"

      - name: Build APK
        run: ./gradlew assembleDefaultDebug assembleDefaultRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ehviewer-miuix-debug
          path: app/build/outputs/apk/default/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ehviewer-miuix-release
          path: app/build/outputs/apk/default/release/*.apk
